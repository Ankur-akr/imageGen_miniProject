
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[context.production.environment]
  NODE_VERSION = "18"
  # VITE_API_URL should be set in Netlify UI or you can set here:
  # VITE_API_URL = "https://imagegen-miniproject.onrender.com"

[dev]
  command = "npm run dev"
  port = 5173
