# create netlify.toml at repo root
cat > netlify.toml <<'EOF'
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[context.production.environment]
  NODE_VERSION = "18"
  # VITE_API_URL = "https://imagegen-miniproject.onrender.com"  # set this in Netlify UI instead of committing it here
EOF

